<!doctype html>
<html lang="en">
<head>

  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/styles.css" />

<body>

      <a class="brand" href="/index.html">

        <a href="/index.html" class="btn btn-outline">Home</a>
